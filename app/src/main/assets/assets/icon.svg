<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04070E"/>
    </linearGradient>

    <!-- Cyan to Emerald Gradient (Pardo Fintech Core) -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Secondary Emerald to Lime Gradient -->
    <linearGradient id="emeraldLime" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (Android / Apple Premium App Icon Canvas) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <rect width="496" height="496" x="8" y="8" rx="110" fill="none" stroke="url(#cyanEmerald)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Backlight Orb -->
  <circle cx="256" cy="245" r="130" fill="#06B6D4" opacity="0.22" filter="url(#intenseGlow)"/>
  <circle cx="290" cy="275" r="95" fill="#10B981" opacity="0.18" filter="url(#intenseGlow)"/>

  <!-- Geometric Shield Vault & Interlocking P-F Monogram -->
  <g filter="url(#softGlow)">
    <!-- Outer Shield Contour -->
    <path d="M256 92 L388 150 C388 280 256 385 256 385 C256 385 124 280 124 150 L256 92 Z" 
          fill="rgba(6, 182, 212, 0.05)" 
          stroke="url(#cyanEmerald)" 
          stroke-width="14" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Central Monogram: Stylized 'P' (Pardo) merging into 'F' (Finanzas) & Upward Growth Arrow -->
    <!-- Vertical Spine of P -->
    <path d="M208 170 L208 322" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Top Loop of P -->
    <path d="M208 170 L275 170 C305 170 326 190 326 218 C326 246 305 266 275 266 L208 266" 
          fill="none" 
          stroke="url(#cyanEmerald)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Crossbar of F forming an upward arrow vector -->
    <path d="M208 220 L300 220" 
          stroke="url(#emeraldLime)" 
          stroke-width="14" 
          stroke-linecap="round"/>

    <!-- Upward Growth Spark Diamond at Apex -->
    <polygon points="256,122 266,138 256,154 246,138" fill="url(#goldGrad)"/>
    <circle cx="326" cy="218" r="6" fill="#00E5FF"/>
    <circle cx="208" cy="322" r="7" fill="#10B981"/>
  </g>

  <!-- Sparkle Stars -->
  <circle cx="360" cy="130" r="4.5" fill="#FDE047"/>
  <circle cx="150" cy="290" r="3.5" fill="#00E5FF" opacity="0.8"/>
</svg>
