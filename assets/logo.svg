<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180">
  <defs>
    <linearGradient id="logoCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark on Left (Center: 90, 90) -->
  <g transform="translate(18, 18) scale(0.28)">
    <!-- Base Squircle -->
    <rect width="512" height="512" rx="118" fill="#0A0F1D"/>
    <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
    <rect width="496" height="496" x="8" y="8" rx="110" fill="none" stroke="url(#logoCyanEmerald)" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Outer Shield -->
    <path d="M256 92 L388 150 C388 280 256 385 256 385 C256 385 124 280 124 150 L256 92 Z" 
          fill="rgba(6, 182, 212, 0.08)" 
          stroke="url(#logoCyanEmerald)" 
          stroke-width="16" 
          stroke-linejoin="round"/>

    <!-- P-F Monogram -->
    <path d="M208 170 L208 322" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <path d="M208 170 L275 170 C305 170 326 190 326 218 C326 246 305 266 275 266 L208 266" 
          fill="none" stroke="url(#logoCyanEmerald)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M208 220 L300 220" stroke="#10B981" stroke-width="16" stroke-linecap="round"/>
    <polygon points="256,122 266,138 256,154 246,138" fill="url(#goldAccent)"/>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(185, 96)">
    <!-- Brand Wordmark -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1.2">
      Pardo<tspan fill="url(#logoCyanEmerald)">Finanzas</tspan>
    </text>

    <!-- Subtitle & Badge -->
    <g transform="translate(2, 28)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="1.5">
        INTELIGENCIA FINANCIERA
      </text>

      <!-- CFO AI Badge -->
      <g transform="translate(230, -16)">
        <rect width="84" height="22" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1"/>
        <circle cx="12" cy="11" r="3.5" fill="#10B981"/>
        <text x="22" y="15" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#00E5FF" letter-spacing="0.5">
          CFO AI
        </text>
      </g>
    </g>
  </g>
</svg>
